<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Cek URL</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #6a11cb, #b491f7);
      margin: 0;
      padding: 40px 20px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
    }

    h2 {
      text-align: center;
      color: #6a11cb;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input[type="url"],
    input[type="date"],
    input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

   
    .form-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
    }

    input[type="submit"],
    input[type="reset"] {
      width: 48%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    input[type="submit"] {
      background-color: #16d325;
    }

    input[type="submit"]:hover {
      background-color: #14a852;
    }

    input[type="reset"] {
      background-color: #c0392b;
    }

    input[type="reset"]:hover {
      background-color: #a5281f;
    }

    @media (max-width: 600px) {
      .form-footer {
        flex-direction: column;
      }

      input[type="submit"],
      input[type="reset"] {
        width: 100%;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Formulir Cek URL Website</h2>

    <section>
      <fieldset>

        <form>
          <label for="web-url">URL Web:</label>
          <input type="url" id="web-url" placeholder="Masukkan alamat web" required>

          <label for="tanggal">Tanggal Cek:</label>
          <input type="date" id="tanggal" name="tanggal" required>

          <label for="jumlah">Jumlah Pengunjung:</label>
          <input type="number" id="jumlah" name="jumlah" min="1" max="100" required>

          <div class="form-footer">
            <input type="submit" value="Kirim">
            <input type="reset" value="Hapus">
          </div>
        </form>
      </fieldset>
    </section>
  </div>

</body>
</html>
